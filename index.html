<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4eadc">
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="排尿記録">
    <title>排尿・尿意記録</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css?v=9">
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="app-header no-print">
        <div>
          <p class="eyebrow">排尿・尿意記録</p>
          <h1 id="screenTitle">今日</h1>
        </div>
        <button class="icon-button" type="button" id="printButton" aria-label="印刷">
          <span aria-hidden="true">⌘</span>
        </button>
      </header>

      <main id="view" class="app-main" tabindex="-1"></main>

      <nav class="tabbar no-print" aria-label="画面切り替え">
        <button type="button" class="tab active" data-tab="today">
          <span aria-hidden="true">○</span><span>今日</span>
        </button>
        <button type="button" class="tab" data-tab="history">
          <span aria-hidden="true">≡</span><span>履歴</span>
        </button>
        <button type="button" class="tab" data-tab="graphs">
          <span aria-hidden="true">⌁</span><span>グラフ</span>
        </button>
        <button type="button" class="tab" data-tab="report">
          <span aria-hidden="true">□</span><span>診察</span>
        </button>
        <button type="button" class="tab" data-tab="settings">
          <span aria-hidden="true">⚙</span><span>設定</span>
        </button>
      </nav>
    </div>

    <div id="sheetBackdrop" class="sheet-backdrop hidden no-print"></div>
    <section id="sheet" class="sheet hidden no-print" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheetContent"></div>
    </section>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="./app.js?v=9"></script>
  </body>
</html>
